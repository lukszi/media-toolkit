[project]
name = "media-toolkit-workspace"
version = "0.0.0"
description = "Development workspace: never published as a distribution."
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.6", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
# In parallel by default (pytest-xdist, in the dev group); `-n 0` runs it in
# one process, which is what a debugger wants. How many workers "auto" means
# is capped in tests/conftest.py.
addopts = ["-n", "auto"]
# so a checkout runs its tests before anything is installed
pythonpath = [
  "packages/mkvkit/src",
  "packages/jfkit/src",
  "packages/dubalign/src",
]
markers = [
  "needs_ffmpeg: requires ffmpeg and ffprobe on PATH",
  "needs_mkvtoolnix: requires the MKVToolNix command-line tools",
  "needs_asr: requires a speech model and is slow",
  "slow: takes more than a few seconds",
  "repository(*paths): checks the checkout itself; skipped when the named files are absent",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/_fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "RUF"]
ignore = [
  # the invented cast and the config keys are ASCII; the prose is not, and a
  # dash in a docstring is not an error
  "RUF002",
  "RUF003",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["packages"]
# A third-party library that ships no type information is a fact about that
# library, not a looser standard for this tree: nothing our own code declares
# is weakened by it, and the one place a stub-less library is called is wrapped
# in an annotated function of our own.
disable_error_code = ["import-untyped"]
mypy_path = [
  "packages/mkvkit/src",
  "packages/jfkit/src",
  "packages/dubalign/src",
]

# The optional numerical extra is not installed everywhere this runs, and the
# module that uses it has a path that does not need it.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
