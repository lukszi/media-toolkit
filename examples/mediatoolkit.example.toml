# Every path, identifier, program location and token these tools use comes
# from one file like this one.
#
#   --config PATH  ->  $MEDIATOOLKIT_CONFIG  ->  ./mediatoolkit.toml  ->  per-user
#
# The per-user location is the roaming application-data directory on Windows
# and $XDG_CONFIG_HOME (or ~/.config) elsewhere, under media-toolkit/config.toml.
#
# Nothing below points anywhere real: these are invented example values, and
# this file is loaded by the test suite to prove it still validates.
#
# Every section and every key is optional. What is missing takes the default
# shown in the comment beside it, and every problem in the file is reported in
# one message rather than one traceback at a time.

[server]
url = "http://127.0.0.1:8096"   # no user or password in the address: refused

# The token is NEVER a value in this file. Name the variable that holds it...
token_env = "JFKIT_TOKEN"
# ...or a command that prints it on its first line:
# token_command = "pass show media/server"
#
# Writing the secret itself into this file is refused at load time, under any
# of the obvious key names. That is deliberate: a secret that reached a file
# once will reach a backup, a paste and a screenshot too.

# The account whose view of the library is used. Item queries are scoped to a
# user by default: an unscoped listing silently omits items. The server prints
# the id with dashes or as 32 bare digits; either form is accepted.
user_id = "00000000-0000-0000-0000-000000000000"

# The server's own data directory is not read from this file: the command that
# needs it, `jfkit libopts roots`, takes it as --data-dir.

[tools]
# A name resolved on the PATH, or an absolute path. Each program is looked for
# in this order, and the first one that exists wins:
#
#   this [tools] entry  ->  MKVKIT_<NAME> in the environment (MKVKIT_FFMPEG,
#   MKVKIT_MKVMERGE, ...)  ->  the PATH  ->  the usual install locations for
#   the platform
#
# So this file wins over the environment; an entry here that names nothing
# that exists falls through to the next step, and the error for a program found
# nowhere lists every place that was tried.
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
mkvmerge = "mkvmerge"
mkvpropedit = "mkvpropedit"
mkvextract = "mkvextract"

[paths]
movies = "/srv/media/movies"
series = "/srv/media/series"
staging = "/srv/staging"     # where a rebuild is assembled before it is swapped in
parked = "/srv/parked"       # where a replaced original is moved, and stays

[policy]
keep_languages = ["eng", "deu"]   # never dropped from a rebuild
droppable_languages = []          # opt-in, and empty by default
default_audio = "eng"

# How `jfkit dedupe` decides between copies of one film or episode. Every key is
# optional; the values shown are the defaults. docs/methods/duplicate-resolution.md
# explains each rule. keep_languages above is also the list of subtitle
# languages a kept copy must have wherever the other copy has them.
[policy.dedupe]
runtime_tolerance_s = 120         # the keeper may be at most this much shorter
max_runtime_gap_s = 600           # further apart than this: different cuts, keep both
# how eligible keepers are ranked, first criterion first
prefer = ["lossless", "channels", "source", "resolution", "bitrate"]
# codec, or codec/profile, globs that count as lossless audio
lossless_codecs = ["truehd*", "mlp*", "flac*", "alac*", "pcm_*", "dts/dts-hd ma*"]
commentary_markers = ["commentary"]   # in a track title
# words in a file or folder name: a re-encode word wins over a source word
reencode_markers = ["x264", "x265", "xvid", "divx", "bdrip", "brrip", "dvdrip", "webrip", "hdrip"]
source_markers = ["remux", "web-dl", "webdl", "untouched"]
keeper_check = "full"             # while planning: full decodes, quick lists packets
apply_keeper_check = "quick"      # again, right before each copy is parked

[langid]
model = "large-v3"
device = "auto"                   # auto, cpu or cuda
# model_dir = "./work/models"    # where the speech model is cached; the
                                 # library default when unset

# The settle bar. These two were fitted against one collection and are
# defaults, not universals; the method document explains how to re-fit them.
# Overturning an existing tag is held to a higher bar than confirming one, so
# override_conf may not be below min_conf.
min_conf = 0.92
override_conf = 0.97

# Three more keys are accepted, so that a file carrying them still loads, but
# no command reads them yet, and setting them changes nothing: [server] data_dir,
# [paths] work, and the whole of [jobs]. Where logs and evidence go is given
# per command (--out, --log-file, --audit), the data directory is a flag, and
# the device gate always allows one heavy reader per device.
