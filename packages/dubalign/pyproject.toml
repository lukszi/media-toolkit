[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dubalign"
description = "Align a dubbed audio track to a different transfer"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 licence expression. PolyForm Noncommercial is not OSI-approved and has no
# standard SPDX id, so it is named by LicenseRef pointing at the full text in LICENSE.
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
keywords = ["audio", "alignment", "drift", "resampling", "splice"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
# Arrays are not optional here: they are what the library is.
dependencies = ["numpy>=1.26", "mkvkit>=0.2"]

[project.urls]
Homepage = "https://github.com/lukszi/media-toolkit"
Repository = "https://github.com/lukszi/media-toolkit"
Issues = "https://github.com/lukszi/media-toolkit/issues"

[project.scripts]
dubalign = "dubalign.cli:main"

[project.optional-dependencies]
# changepoint detection and the windowed-sinc resampling kernels
align = ["numpy>=1.26", "scipy>=1.11"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "src/dubalign/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dubalign"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
