[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dubalign"
description = "align a foreign dub to a different transfer"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 licence expression. PolyForm Noncommercial is not OSI-approved and has no
# standard SPDX id, so it is named by LicenseRef pointing at the full text in LICENSE.
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
dependencies = ["numpy>=1.26"]

[project.scripts]
dubalign = "dubalign.cli:main"

[project.optional-dependencies]
changepoint = ["scipy>=1.11"]

[tool.hatch.version]
path = "src/dubalign/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dubalign"]
