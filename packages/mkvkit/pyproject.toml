[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkvkit"
description = "Matroska surgery and verification"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 licence expression. PolyForm Noncommercial is not OSI-approved and has no
# standard SPDX id, so it is named by LicenseRef pointing at the full text in LICENSE.
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
dependencies = []

[project.scripts]
mkvkit = "mkvkit.cli:main"

[project.optional-dependencies]
asr = ["faster-whisper>=1.2", "ctranslate2>=4.8", "numpy>=1.26"]
numeric = ["numpy>=1.26"]

[tool.hatch.version]
path = "src/mkvkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mkvkit"]
