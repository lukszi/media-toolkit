name: ci

on:
  push:
  pull_request:
  # The whole history, not only what one push or pull request brought: once a
  # week, and by hand from the Actions tab.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to the commit its release tag named when it was
# pinned, with that tag beside it. A tag can be moved; a commit cannot, so
# a new release of an action arrives as a reviewed change to this file.
jobs:
  # The privacy gate runs first and alone. If it fails nothing else matters,
  # and nothing else should waste a runner finding that out.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: the gate must fail when it should
        run: python tests/deny_scan.py --canary
      - name: scan the tree
        run: python tests/deny_scan.py --tree .
      # Commit headers are not content, so no content rule reads them: every
      # author and committer on every commit must be the published identity.
      - name: every author and committer, over the whole history
        run: python tests/deny_scan.py --identities HEAD
      # A pull request is scanned from its base, a push from the commit the
      # branch pointed at before it. A push with no usable "before" -- the
      # first push of a branch or tag, or a force push whose old tip is not
      # in the clone -- and the weekly and manual runs scan every commit on
      # HEAD instead. Either way every commit is scanned on its own (its
      # added lines, or a root commit's whole tree), so a line added and
      # removed again inside one push is still seen, and so is every message.
      # A range the scanner cannot resolve is reported as "nothing to
      # compare" and passes, so it is checked here before it is handed over.
      - name: scan the change and its messages
        if: github.event_name != 'push' || !github.event.deleted
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          revisions="HEAD"
          if [ "$EVENT" = "pull_request" ]; then
            revisions="$PR_BASE..$AFTER"
          elif [ "$EVENT" = "push" ] \
              && [ -n "$BEFORE" ] \
              && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            revisions="$BEFORE..$AFTER"
          fi
          rc=0
          python tests/deny_scan.py --messages "$revisions" || rc=1
          for c in $(git rev-list "$revisions"); do
            if git rev-parse --verify --quiet "$c^" > /dev/null; then
              python tests/deny_scan.py --diff "$c^..$c" || rc=1
            else
              root="$RUNNER_TEMP/root-$c"
              mkdir -p "$root"
              git archive "$c" | tar -x -C "$root"
              python tests/deny_scan.py --tree "$root" || rc=1
            fi
          done
          exit "$rc"

  # On a pull request and a push the action scans the commits that event
  # brought; on the schedule and on a manual run it scans the full history.
  gitleaks:
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  lint:
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Pinned: a new release of either one is a change to the gate, and it
      # arrives as a commit rather than as a red build nobody caused.
      - run: pip install ruff==0.15.0 mypy==1.19.1
      - run: ruff check .
      - name: install the packages so the type checker sees them
        run: pip install -e packages/mkvkit -e packages/jfkit -e packages/dubalign
      - run: mypy

  test:
    needs: [gate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install -U pip
          pip install -e packages/mkvkit -e packages/jfkit -e packages/dubalign
          pip install pytest pytest-xdist

      # First, the run that has to work on a machine with nothing installed.
      # If this selection ever needs a program, a test has grown a dependency
      # it did not declare. Every pytest run here is parallel: the root
      # pyproject.toml asks for "-n auto", as it does on a workstation.
      - name: tests with no external programs
        run: pytest -m "not needs_ffmpeg and not needs_mkvtoolnix and not needs_asr"

      - name: install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mkvtoolnix
      - name: install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install -y ffmpeg mkvtoolnix

      # The generated media, kept between runs. The key is what the set is
      # built from; the generator also keys its own directory by the programs
      # that encode, so a runner whose ffmpeg changed builds a fresh set beside
      # a restored one rather than trusting it. No restore-keys: a new key
      # starts empty, so an old set is never carried forward and saved again.
      - name: restore the generated fixtures
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tests/_fixtures
          key: fixtures-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('tests/fixtures/make_fixtures.py', 'tests/synthetic.py', 'packages/dubalign/src/dubalign/*.py') }}
      # Built once here, before the workers start, rather than by the first
      # worker to want it while the rest wait on its lock.
      - name: build the fixtures
        run: python -m tests.fixtures build
      - name: the whole suite, minus the one that wants a speech model
        run: pytest -m "not needs_asr"
