<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="t d">
<title id="t">Plan, dry run, apply, verify</title>
<desc id="d">Every writing command plans first, shows a dry run by default, applies only a reviewed plan with an audit log, and verifies the result. Replaced files are parked, never deleted.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8C959F"/></marker></defs>
<g transform="translate(16,14)"><rect x="0.5" y="0.5" width="186" height="112" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/><rect x="0.5" y="0.5" width="5" height="112" rx="2.5" fill="#0969DA"/><circle cx="30" cy="30" r="13" fill="#0969DA"/><text x="30" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">1</text><text x="52" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2328">Plan</text><text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">reads the library,</text><text x="18" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">decides every step</text><text x="18" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#0969DA">read-only</text></g>
<line x1="207" y1="70.0" x2="230" y2="70.0" stroke="#8C959F" stroke-width="2" marker-end="url(#a)"/>
<g transform="translate(234,14)"><rect x="0.5" y="0.5" width="186" height="112" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/><rect x="0.5" y="0.5" width="5" height="112" rx="2.5" fill="#9A6700"/><circle cx="30" cy="30" r="13" fill="#9A6700"/><text x="30" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">2</text><text x="52" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2328">Dry run</text><text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">shows the plan;</text><text x="18" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">save it, diff it</text><text x="18" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#9A6700">the default</text></g>
<line x1="425" y1="70.0" x2="448" y2="70.0" stroke="#8C959F" stroke-width="2" marker-end="url(#a)"/>
<g transform="translate(452,14)"><rect x="0.5" y="0.5" width="186" height="112" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/><rect x="0.5" y="0.5" width="5" height="112" rx="2.5" fill="#1A7F37"/><circle cx="30" cy="30" r="13" fill="#1A7F37"/><text x="30" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">3</text><text x="52" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2328">Apply</text><text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">runs the saved plan,</text><text x="18" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">logs every step</text><text x="18" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#1A7F37">--apply --audit</text></g>
<line x1="643" y1="70.0" x2="666" y2="70.0" stroke="#8C959F" stroke-width="2" marker-end="url(#a)"/>
<g transform="translate(670,14)"><rect x="0.5" y="0.5" width="186" height="112" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/><rect x="0.5" y="0.5" width="5" height="112" rx="2.5" fill="#8250DF"/><circle cx="30" cy="30" r="13" fill="#8250DF"/><text x="30" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">4</text><text x="52" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2328">Verify</text><text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">checks the end state</text><text x="18" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">against the plan</text><text x="18" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8250DF">resumable</text></g>
<rect x="16.5" y="146" width="867" height="44" rx="10" fill="#FFF8C5" stroke="#D4A72C" stroke-dasharray="5 4"/><text x="450.0" y="173" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#7D4E00"><tspan font-weight="700">Parked, never deleted.</tspan> Anything replaced or removed is moved aside, with its layout, until you decide.</text>
</svg>
