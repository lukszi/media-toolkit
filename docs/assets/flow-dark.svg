<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="t d">
<title id="t">Plan, dry run, apply, verify</title>
<desc id="d">Every writing command plans first, shows a dry run by default, applies only a reviewed plan with an audit log, and verifies the result. Replaced files are parked, never deleted.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6E7681"/></marker></defs>
<g transform="translate(16,14)"><rect x="0.5" y="0.5" width="186" height="112" rx="12" fill="#161B22" stroke="#30363D"/><rect x="0.5" y="0.5" width="5" height="112" rx="2.5" fill="#58A6FF"/><circle cx="30" cy="30" r="13" fill="#58A6FF"/><text x="30" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D1117">1</text><text x="52" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F0F6FC">Plan</text><text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9198A1">reads the library,</text><text x="18" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9198A1">decides every step</text><text x="18" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#58A6FF">read-only</text></g>
<line x1="207" y1="70.0" x2="230" y2="70.0" stroke="#6E7681" stroke-width="2" marker-end="url(#a)"/>
<g transform="translate(234,14)"><rect x="0.5" y="0.5" width="186" height="112" rx="12" fill="#161B22" stroke="#30363D"/><rect x="0.5" y="0.5" width="5" height="112" rx="2.5" fill="#D29922"/><circle cx="30" cy="30" r="13" fill="#D29922"/><text x="30" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D1117">2</text><text x="52" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F0F6FC">Dry run</text><text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9198A1">shows the plan;</text><text x="18" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9198A1">save it, diff it</text><text x="18" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#D29922">the default</text></g>
<line x1="425" y1="70.0" x2="448" y2="70.0" stroke="#6E7681" stroke-width="2" marker-end="url(#a)"/>
<g transform="translate(452,14)"><rect x="0.5" y="0.5" width="186" height="112" rx="12" fill="#161B22" stroke="#30363D"/><rect x="0.5" y="0.5" width="5" height="112" rx="2.5" fill="#3FB950"/><circle cx="30" cy="30" r="13" fill="#3FB950"/><text x="30" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D1117">3</text><text x="52" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F0F6FC">Apply</text><text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9198A1">runs the saved plan,</text><text x="18" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9198A1">logs every step</text><text x="18" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#3FB950">--apply --audit</text></g>
<line x1="643" y1="70.0" x2="666" y2="70.0" stroke="#6E7681" stroke-width="2" marker-end="url(#a)"/>
<g transform="translate(670,14)"><rect x="0.5" y="0.5" width="186" height="112" rx="12" fill="#161B22" stroke="#30363D"/><rect x="0.5" y="0.5" width="5" height="112" rx="2.5" fill="#BC8CFF"/><circle cx="30" cy="30" r="13" fill="#BC8CFF"/><text x="30" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D1117">4</text><text x="52" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F0F6FC">Verify</text><text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9198A1">checks the end state</text><text x="18" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9198A1">against the plan</text><text x="18" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#BC8CFF">resumable</text></g>
<rect x="16.5" y="146" width="867" height="44" rx="10" fill="#272115" stroke="#9E6A03" stroke-dasharray="5 4"/><text x="450.0" y="173" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#E3B341"><tspan font-weight="700">Parked, never deleted.</tspan> Anything replaced or removed is moved aside, with its layout, until you decide.</text>
</svg>
